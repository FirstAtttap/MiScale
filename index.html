<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умные весы -> Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2aabee;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button.secondary {
            background-color: #333;
            font-size: 14px;
            padding: 10px;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #weight-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0 10px;
            color: #4caf50;
        }
        #status {
            color: #aaaaaa;
            font-size: 14px;
            min-height: 40px;
        }
        .user-badge {
            background: #2c2c2c;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2aabee;
            display: inline-block;
            margin-bottom: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚖️ Mi Scale Bot</h2>
    
    <!-- Экран первичной настройки (на каждом телефоне свой) -->
    <div id="setup-box">
        <p style="font-size: 13px; color: #bbb;">Настройка профиля (данные сохранятся только в памяти этого телефона):</p>
        <input type="text" id="name-input" placeholder="Ваше имя (например, Алексей)">
        <input type="password" id="token-input" placeholder="Токен бота (123456:ABC...)">
        <input type="text" id="chatid-input" placeholder="Ваш личный Chat ID (из @userinfobot)">
        <button onclick="saveProfile()">Сохранить профиль</button>
    </div>

    <!-- Основной экран взвешивания -->
    <div id="main-box" class="hidden">
        <div id="user-label" class="user-badge"></div>
        <div id="weight-display">--.-- кг</div>
        <div id="status">Нажмите кнопку и встаньте на весы</div>
        <button id="scan-btn" onclick="startScan()">Взвеситься</button>
        <button class="secondary" onclick="resetProfile()">Изменить настройки</button>
    </div>
</div>

<script>
    const SCALE_UUID = 0x181b;
    let lastSendTime = 0;

    // Проверяем наличие сохраненного профиля при открытии страницы
    window.onload = () => {
        const token = localStorage.getItem('tg_bot_token');
        const chatId = localStorage.getItem('tg_chat_id');
        const userName = localStorage.getItem('tg_user_name') || 'Пользователь';

        if (token && chatId) {
            document.getElementById('user-label').innerText = `👤 Профиль: ${userName}`;
            document.getElementById('setup-box').classList.add('hidden');
            document.getElementById('main-box').classList.remove('hidden');
        }
    };

    function saveProfile() {
        const name = document.getElementById('name-input').value.trim() || 'Пользователь';
        const token = document.getElementById('token-input').value.trim();
        const chatId = document.getElementById('chatid-input').value.trim();

        if (!token.includes(':')) {
            alert('Проверьте формат токена бота (должно быть двоеточие)');
            return;
        }
        if (!chatId || isNaN(chatId)) {
            alert('Chat ID должен состоять только из цифр (узнайте его у @userinfobot)');
            return;
        }

        localStorage.setItem('tg_user_name', name);
        localStorage.setItem('tg_bot_token', token);
        localStorage.setItem('tg_chat_id', chatId);
        
        location.reload();
    }

    function resetProfile() {
        localStorage.removeItem('tg_user_name');
        localStorage.removeItem('tg_bot_token');
        localStorage.removeItem('tg_chat_id');
        location.reload();
    }

    async function sendToTelegram(text) {
        const botToken = localStorage.getItem('tg_bot_token');
        const chatId = localStorage.getItem('tg_chat_id');
        const url = `https://telegram.org{botToken}/sendMessage`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
            const data = await response.json();
            if (!data.ok) {
                document.getElementById('status').innerText = `Ошибка Telegram: ${data.description}`;
            } else {
                document.getElementById('status').innerText = "✅ Отправлено в ваш Telegram!";
            }
        } catch (err) {
            document.getElementById('status').innerText = `Ошибка сети: ${err.message}`;
        }
    }

    async function startScan() {
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('scan-btn');

        if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
            statusEl.innerText = "❌ Включите Experimental Web Platform features в chrome://flags и откройте сайт по HTTPS";
            return;
        }

        try {
            btn.disabled = true;
            statusEl.innerText = "🔍 Ищу весы... Встаньте на них босиком";

            const scan = await navigator.bluetooth.requestLEScan({
                filters: [{ services: [SCALE_UUID] }],
                keepRepeatedDevices: true
            });

            navigator.bluetooth.addEventListener('advertisementreceived', event => {
                const serviceData = event.serviceData.get(SCALE_UUID) || 
                                    event.serviceData.get("0000181b-0000-1000-8000-00805f9b34fb");
                
                if (!serviceData || serviceData.byteLength < 13) return;

                const ctrlByte0 = serviceData.getUint8(0);
                const ctrlByte1 = serviceData.getUint8(1);

                const isStabilized = (ctrlByte1 & (1 << 5)) !== 0;
                const hasImpedance = (ctrlByte1 & (1 << 1)) !== 0;

                const rawWeight = serviceData.getUint16(11, true);
                const isLbs = (ctrlByte0 & 0x01) !== 0;
                const weight = isLbs ? (rawWeight / 100).toFixed(2) : (rawWeight / 200).toFixed(2);

                document.getElementById('weight-display').innerText = `${weight} кг`;

                if (isStabilized) {
                    const now = Date.now();
                    if (now - lastSendTime < 15000) return;
                    lastSendTime = now;

                    let impedance = null;
                    if (hasImpedance) {
                        impedance = serviceData.getUint16(9, true);
                    }

                    const userName = localStorage.getItem('tg_user_name') || 'Пользователь';
                    let msg = `⚖️ **Новый замер (${userName})**\n• Вес: \`${weight} кг\``;
                    if (impedance && impedance > 0) {
                        msg += `\n• Импеданс: \`${impedance} Ом\``;
                    } else {
                        msg += `\n• Импеданс: _не измерен (вставайте босиком)_`;
                    }

                    statusEl.innerText = "⏳ Вес зафиксирован, отправляю...";
                    sendToTelegram(msg);
                    scan.stop();
                    btn.disabled = false;
                }
            });

        } catch (error) {
            statusEl.innerText = `Ошибка Bluetooth: ${error.message}`;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
